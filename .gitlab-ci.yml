stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  PRODUCTION_TAG: "$CI_REGISTRY_IMAGE:production"
  LATEST_TAG: "$CI_REGISTRY_IMAGE:latest"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.docker-job:
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command:
        - --tls=false
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

test-python:
  stage: test
  image: python:3.11-slim
  interruptible: true
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  script:
    - python -m pip install --disable-pip-version-check --requirement requirements.txt
    - python -m pip check
    - python -m compileall -q backend core frontend tests

build-image:
  extends: .docker-job
  stage: build
  interruptible: true
  needs:
    - test-python
  script:
    - docker compose config --quiet
    - docker pull "$PRODUCTION_TAG" || true
    - |
      docker build \
        --pull \
        --cache-from "$PRODUCTION_TAG" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --tag "$IMAGE_TAG" \
        .
    - docker push "$IMAGE_TAG"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        release_tag="$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
        docker tag "$IMAGE_TAG" "$release_tag"
        docker push "$release_tag"
      fi
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

promote-production-image:
  extends: .docker-job
  stage: deploy
  needs:
    - build-image
  script:
    - docker pull "$IMAGE_TAG"
    - docker tag "$IMAGE_TAG" "$PRODUCTION_TAG"
    - docker tag "$IMAGE_TAG" "$LATEST_TAG"
    - docker push "$PRODUCTION_TAG"
    - docker push "$LATEST_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
